name: Tag and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  prepare:
    name: Prepare Release
    permissions:
      contents: write
      id-token: write
    needs: ci
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@02fcd089a850e25bc6eff55f74db80c12b54391e # v2.3.4
    with:
      stage: prepare
      assets: false
      default-branch: main
      version-command: nix run nixpkgs#fq -- -r .workspace.package.version Cargo.toml
