name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the loader, then the installer with it embedded
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --locked --release -p phoenix-loader
          $env:RUBYCORD_LOADER_DLL = "$PWD\target\release\phoenix.dll"
          cargo build --locked --release -p rubycord-installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/rubycord-installer.exe
          if-no-files-found: error

  # Ubuntu 22.04 links against an older glibc than Discord's AppImage needs, so the loader works anywhere Discord does.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked --release -p phoenix-loader
      - name: "One file: the installer script with the loader appended"
        run: |
          { cat scripts/rubycord-linux.sh; echo __PAYLOAD__; cat target/release/libphoenix.so; } > rubycord-installer-linux
          chmod +x rubycord-installer-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: rubycord-installer-linux
          if-no-files-found: error

  # One rolling "latest" release, replaced on every push, so the download link never changes.
  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # YEAR.MAJOR.MINOR, from the workspace Cargo.toml.
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "RubyCord $version" --notes "RubyCord $version, built from $GITHUB_SHA" \
            dist/rubycord-installer.exe dist/rubycord-installer-linux
