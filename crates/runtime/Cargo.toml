[package]
name              = "phoenix-runtime"
description       = "QuickJS plugin runtime that drives phoenix's gateway hooks, shared by every platform"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
crc32fast    = { workspace = true }
flub         = { workspace = true }
log          = { workspace = true }
memchr       = { workspace = true }
phoenix-hook = { workspace = true }
phoenix-sigs = { workspace = true }
rquickjs     = { workspace = true }
rusqlite     = { optional = true, workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# rquickjs-sys ships pregenerated bindings for desktop triples only.
rquickjs = { features = [ "bindgen" ], workspace = true }

[target."cfg(unix)".dependencies]
libc = { workspace = true }

[features]
sqlite = [ "dep:rusqlite" ]

[lints]
workspace = true
