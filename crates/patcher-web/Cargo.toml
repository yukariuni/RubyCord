[package]
name = "patcher-web"
description = "The patcher as wasm, for the site"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
crate-type = [ "cdylib" ]

[dependencies]
# rsa pulls it in through num-bigint-dig. Signing never draws from it.
getrandom    = { features = [ "js" ], version = "0.2" }
js-sys       = "0.3"
patcher      = { path = "../patcher" }
wasm-bindgen = "=0.2.130"
web-sys      = { features = [ "Blob", "BlobPropertyBag", "FileReaderSync" ], version = "0.3" }

[lints]
workspace = true
